[package]
name = "sdkwork-routes-news-backend-api"
version.workspace = true
edition.workspace = true

[lib]
name = "sdkwork_routes_news_backend_api"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
tracing = "0.1"
sdkwork-routes-news-open-api = { workspace = true }
sdkwork-web-core = { workspace = true }
